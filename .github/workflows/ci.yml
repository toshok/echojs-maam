# maam-fable CI: typecheck, unit suite, both builds, and the Phase 3.5
# differential harness (docs in echojs docs/maam-plan.md).
#
# The harness's node + containment lanes run here on the closed-world corpus
# (test/differential/corpus). The ejs lane needs an echojs dev tree with an
# assembled stage0 work tree, which this repo's CI does not have — the harness
# reports that lane as SKIPPED loudly and gates on the other two.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned to match the echojs consumer (its CI runs node 22.4.0; the
          # CJS build exists because that node cannot require(esm)).
          node-version: 22.4.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:cjs
      - run: npm run diff-harness
